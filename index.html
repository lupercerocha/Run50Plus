<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Run50+</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#09090b;--bg2:#111115;--bg3:#18181e;--bg4:#22222b;--bg5:#2a2a36;
  --border:rgba(255,255,255,0.06);--border2:rgba(255,255,255,0.1);--border3:rgba(255,255,255,0.15);
  --t1:#f4f4f6;--t2:#9898ac;--t3:#5c5c72;--t4:#3a3a50;
  --ora:#f97316;--ora2:rgba(249,115,22,.15);--ora3:rgba(249,115,22,.3);
  --blu:#60a5fa;--blu2:rgba(96,165,250,.12);--blu3:rgba(96,165,250,.28);
  --grn:#34d399;--grn2:rgba(52,211,153,.12);--grn3:rgba(52,211,153,.28);
  --red:#f87171;--red2:rgba(248,113,113,.12);--red3:rgba(248,113,113,.28);
  --yel:#fbbf24;--yel2:rgba(251,191,36,.12);--yel3:rgba(251,191,36,.28);
  --pur:#a78bfa;--pur2:rgba(167,139,250,.12);--pur3:rgba(167,139,250,.28);
  --r:12px;--rs:8px;--rx:18px;
}
[data-theme=light]{
  --bg:#f2f2f5;--bg2:#ffffff;--bg3:#ebebf2;--bg4:#e0e0ea;--bg5:#d6d6e4;
  --border:rgba(0,0,0,0.06);--border2:rgba(0,0,0,0.1);--border3:rgba(0,0,0,0.14);
  --t1:#111118;--t2:#5a5a70;--t3:#9898ac;--t4:#c0c0d0;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Barlow',sans-serif;background:var(--bg);color:var(--t1);min-height:100vh;font-size:14px;-webkit-tap-highlight-color:transparent}
.app{max-width:440px;margin:0 auto;padding-bottom:30px}
.mono{font-family:'JetBrains Mono',monospace}

/* ─ HEADER ─ */
.hdr{display:flex;align-items:center;justify-content:space-between;padding:13px 15px;position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--border2)}
.logo{display:flex;align-items:center;gap:8px}
.logo-icon{width:28px;height:28px;background:var(--ora);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:#fff;font-style:italic;letter-spacing:-1px}
.logo-text{font-size:16px;font-weight:800;letter-spacing:-0.03em}
.logo-text em{color:var(--ora);font-style:normal}
.hdr-right{display:flex;align-items:center;gap:6px}
.phase-tag{font-size:10px;font-weight:700;letter-spacing:0.08em;padding:3px 9px;border-radius:20px;text-transform:uppercase}
.pt1{background:var(--ora2);color:var(--ora);border:1px solid var(--ora3)}
.pt2{background:var(--pur2);color:var(--pur);border:1px solid var(--pur3)}
.icon-btn{background:none;border:none;cursor:pointer;color:var(--t3);font-size:15px;padding:5px 7px;border-radius:7px;transition:all .15s}
.icon-btn:hover{background:var(--bg3);color:var(--t1)}

/* ─ NAV ─ */
.nav{display:flex;padding:0 10px;border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none;gap:2px}
.nav::-webkit-scrollbar{display:none}
.nb{background:none;border:none;color:var(--t3);font-family:'Barlow',sans-serif;font-size:13px;font-weight:600;padding:10px 11px 9px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:all .15s;letter-spacing:0.01em}
.nb.on{color:var(--ora);border-bottom-color:var(--ora)}

/* ─ CARD ─ */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:15px;margin:11px 13px}
.card-lbl{font-size:10px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--t3);margin-bottom:9px}

/* ─ SECTION ─ */
.sec-hd{font-size:10px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--t3);padding:14px 15px 5px}
.div{height:1px;background:var(--border);margin:11px 0}

/* ─ TODAY ─ */
.today-top{padding:16px 15px 4px}
.today-day{font-size:23px;font-weight:800;letter-spacing:-0.03em;line-height:1.1}
.today-meta{display:flex;align-items:center;gap:9px;margin-top:3px;font-size:12px;color:var(--t2);flex-wrap:wrap}
.sep{width:3px;height:3px;border-radius:50%;background:var(--t4)}
.chips-row{display:flex;gap:7px;flex-wrap:wrap;margin:9px 13px 0}
.chip{background:var(--bg2);border:1px solid var(--border);border-radius:7px;padding:5px 9px;font-size:11px;color:var(--t2)}
.chip strong{color:var(--t1);font-size:13px;font-family:'JetBrains Mono',monospace;margin-right:1px}

/* ─ BADGES ─ */
.badge{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px;letter-spacing:0.04em;text-transform:uppercase}
.bl{background:var(--grn2);color:var(--grn);border:1px solid var(--grn3)}
.bm{background:var(--blu2);color:var(--blu);border:1px solid var(--blu3)}
.bi{background:var(--red2);color:var(--red);border:1px solid var(--red3)}
.blo{background:var(--yel2);color:var(--yel);border:1px solid var(--yel3)}
.ba{background:var(--pur2);color:var(--pur);border:1px solid var(--pur3)}
.bt{background:var(--red2);color:#fca5a5;border:1px solid var(--red3)}
.bd{background:var(--bg3);color:var(--t3);border:1px solid var(--border)}

/* ─ CHECKIN ─ */
.ci-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.ci-label{font-size:12px;color:var(--t2);margin-bottom:5px;font-weight:500}
.stars{display:flex;gap:3px}
.star{width:34px;height:30px;background:var(--bg3);border:1px solid var(--border);border-radius:6px;color:var(--t3);font-size:12px;font-weight:700;cursor:pointer;transition:all .12s;font-family:'JetBrains Mono',monospace}
.star.on{background:var(--ora);color:#fff;border-color:var(--ora)}

/* ─ BUTTONS ─ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 16px;border-radius:var(--rs);font-family:'Barlow',sans-serif;font-size:14px;font-weight:600;cursor:pointer;border:none;transition:all .15s;letter-spacing:0.01em;white-space:nowrap}
.btn-o{background:var(--ora);color:#fff}
.btn-o:hover{opacity:.88}
.btn-g{background:var(--grn);color:#0d1a14}
.btn-g:hover{opacity:.88}
.btn-gh{background:var(--bg3);color:var(--t1);border:1px solid var(--border2)}
.btn-gh:hover{background:var(--bg4)}
.btn-w{width:100%}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-row{display:flex;gap:8px;margin-top:11px}
.spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ─ TRAINING CARD ─ */
.t-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:12px}
.t-cell{background:var(--bg3);border-radius:8px;padding:8px 10px}
.t-cell-k{font-size:9px;color:var(--t3);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:2px}
.t-cell-v{font-size:12px;font-weight:700;font-family:'JetBrains Mono',monospace}
.t-desc{font-size:13px;line-height:1.75;color:var(--t2);white-space:pre-wrap}
.t-obs{background:var(--bg3);border-left:3px solid var(--ora);border-radius:0 8px 8px 0;padding:9px 12px;font-size:12px;color:var(--t2);margin-top:11px}
.t-moto{font-size:11px;color:var(--t3);font-style:italic;margin-top:9px;text-align:center}

/* ─ INPUTS ─ */
.field{margin-bottom:10px}
.field label{display:block;font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:var(--t3);margin-bottom:4px}
.field input,.field textarea,.field select{width:100%;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--rs);padding:8px 10px;color:var(--t1);font-family:'Barlow',sans-serif;font-size:13px;transition:border-color .15s}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--ora)}
.field textarea{resize:vertical;min-height:60px}
.field .hint{font-size:10px;color:var(--t3);margin-top:3px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}
.pace-calc{font-size:11px;color:var(--grn);margin-top:3px;font-family:'JetBrains Mono',monospace;min-height:14px}

/* ─ ZONE SLIDERS ─ */
.z-row{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.z-label{width:24px;font-size:11px;font-weight:700;font-family:'JetBrains Mono',monospace;flex-shrink:0}
.z-input{width:52px;background:var(--bg3);border:1px solid var(--border2);border-radius:5px;padding:4px 7px;color:var(--t1);font-family:'JetBrains Mono',monospace;font-size:12px;text-align:right}
.z-bar-wrap{flex:1;background:var(--bg4);border-radius:4px;height:6px;overflow:hidden}
.z-bar{height:100%;border-radius:4px;transition:width .3s}
.z-sum{font-size:11px;font-family:'JetBrains Mono',monospace;text-align:right;margin-top:4px}
.z-sum.ok{color:var(--grn)} .z-sum.err{color:var(--red)}

/* ─ SCORE RING ─ */
.score-wrap{display:flex;align-items:center;gap:16px;padding:6px 0}
.score-ring{position:relative;width:80px;height:80px;flex-shrink:0}
.score-ring svg{transform:rotate(-90deg)}
.score-num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.score-val{font-size:22px;font-weight:800;font-family:'JetBrains Mono',monospace;line-height:1}
.score-lbl{font-size:9px;color:var(--t3);text-transform:uppercase;letter-spacing:0.06em;margin-top:1px}
.score-breakdown{flex:1}
.sb-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.sb-name{font-size:11px;color:var(--t2);width:82px;flex-shrink:0;font-weight:500}
.sb-bar{flex:1;background:var(--bg4);border-radius:3px;height:5px;overflow:hidden}
.sb-fill{height:100%;border-radius:3px;transition:width .8s cubic-bezier(.2,.8,.4,1)}
.sb-val{font-size:11px;font-family:'JetBrains Mono',monospace;color:var(--t2);width:28px;text-align:right}
.score-interp{font-size:12px;color:var(--t2);line-height:1.5;margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}

/* ─ ALERTS ─ */
.alert{display:flex;align-items:flex-start;gap:9px;padding:9px 12px;border-radius:var(--rs);font-size:12px;margin-bottom:8px}
.alert-ico{font-size:14px;flex-shrink:0;margin-top:1px}
.al-warn{background:var(--yel2);color:var(--yel);border:1px solid var(--yel3)}
.al-danger{background:var(--red2);color:var(--red);border:1px solid var(--red3)}
.al-ok{background:var(--grn2);color:var(--grn);border:1px solid var(--grn3)}
.al-info{background:var(--blu2);color:var(--blu);border:1px solid var(--blu3)}

/* ─ WEEK GRID ─ */
.wk-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:0 13px}
.wd{background:var(--bg2);border:1px solid var(--border);border-radius:9px;padding:8px 3px;text-align:center;cursor:pointer;transition:all .15s}
.wd.today{border-color:var(--ora);background:var(--ora2)}
.wd.done{border-color:var(--grn)}
.wd.missed{opacity:.45}
.wd-name{font-size:8px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--t3)}
.wd-icon{font-size:17px;margin:4px 0 2px}
.wd-num{font-size:9px;color:var(--t3);font-family:'JetBrains Mono',monospace}

/* ─ METRICS GRID ─ */
.mg{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:0 13px}
.mc{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rs);padding:13px}
.mc-v{font-size:26px;font-weight:800;font-family:'JetBrains Mono',monospace;color:var(--ora);line-height:1}
.mc-l{font-size:11px;color:var(--t2);margin-top:3px;font-weight:500}
.mc-bar{background:var(--bg3);border-radius:3px;height:4px;overflow:hidden;margin-top:7px}
.mc-fill{height:100%;border-radius:3px;background:var(--ora);transition:width .8s cubic-bezier(.2,.8,.4,1)}
.mc-fill.g{background:var(--grn)}

/* ─ CHARTS ─ */
.chart-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:14px;margin:10px 13px}
.chart-title{font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--t3);margin-bottom:10px}
.chart-sub{font-size:10px;color:var(--t3);margin-top:5px}
canvas{max-width:100%}

/* ─ HISTORY ─ */
.hi{display:flex;gap:11px;padding:10px 0;border-bottom:1px solid var(--border)}
.hi:last-child{border-bottom:none}
.hi-dot{width:8px;height:8px;border-radius:50%;background:var(--grn);margin-top:5px;flex-shrink:0}
.hi-dot.miss{background:var(--t4)}
.hi-date{font-size:10px;color:var(--t3);margin-bottom:2px;font-weight:600;letter-spacing:0.04em;text-transform:uppercase}
.hi-name{font-size:13px;font-weight:600}
.hi-ms{display:flex;gap:9px;margin-top:4px;flex-wrap:wrap}
.hi-m{font-size:10px;font-family:'JetBrains Mono',monospace;color:var(--t2)}
.hi-m span{color:var(--t3);margin-right:2px}

/* ─ DONE BANNER ─ */
.done-banner{background:var(--grn2);border:1px solid var(--grn3);border-radius:var(--rs);padding:10px 13px;display:flex;align-items:center;gap:9px;font-size:13px;color:var(--grn);font-weight:600}

/* ─ ZONE FC REF ─ */
.zfc-row{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--border)}
.zfc-row:last-child{border-bottom:none}
.zfc-tag{font-size:9px;font-weight:800;padding:2px 7px;border-radius:20px;font-family:'JetBrains Mono',monospace;letter-spacing:0.04em;flex-shrink:0}
.z1c{background:rgba(52,211,153,.15);color:#34d399}
.z2c{background:rgba(163,230,53,.15);color:#a3e635}
.z3c{background:rgba(251,191,36,.15);color:#fbbf24}
.z4c{background:rgba(249,115,22,.15);color:#fb923c}
.z5c{background:rgba(248,113,113,.15);color:#f87171}

/* ─ SETUP OVERLAY ─ */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.setup-card{background:var(--bg2);border:1px solid var(--border3);border-radius:var(--r);padding:24px;width:100%;max-width:380px}
.setup-title{font-size:20px;font-weight:800;margin-bottom:5px;letter-spacing:-0.02em}
.setup-sub{font-size:13px;color:var(--t2);margin-bottom:18px;line-height:1.55}

/* ─ VIEWS ─ */
.view{display:none}
.view.on{display:block}

/* ─ SCORE COLOR ─ */
.sc-ex{color:#34d399} .sc-ok{color:#a3e635} .sc-wa{color:#fbbf24} .sc-bd{color:#f87171}
.sf-ex{background:#34d399} .sf-ok{background:#a3e635} .sf-wa{background:#fbbf24} .sf-bd{background:#f87171}
</style>
</head>
<body>

<!-- SETUP -->
<div class="overlay" id="setup" style="display:none">
  <div class="setup-card">
    <div class="setup-title">Run<em style="color:var(--ora);font-style:normal">50+</em></div>
    <div class="setup-sub">Sistema avançado de treinamento. Configure sua chave da API Anthropic para treinos gerados por IA.</div>
    <div class="field"><label>Chave API Anthropic (opcional)</label><input type="password" id="key-inp" placeholder="sk-ant-..."></div>
    <button class="btn btn-o btn-w" onclick="saveKey()">Salvar e Começar</button>
    <button class="btn btn-gh btn-w" style="margin-top:8px" onclick="skipSetup()">Usar sem IA</button>
  </div>
</div>

<!-- APP -->
<div class="app" id="app">
  <header class="hdr">
    <div class="logo">
      <div class="logo-icon">R+</div>
      <div class="logo-text">Run<em>50+</em></div>
    </div>
    <div class="hdr-right">
      <span class="phase-tag pt1" id="hdr-phase">Fase 1 · 21km</span>
      <button class="icon-btn" onclick="toggleTheme()">◑</button>
    </div>
  </header>

  <nav class="nav">
    <button class="nb on"  id="tab-hoje"      onclick="sv('hoje')">Hoje</button>
    <button class="nb"     id="tab-semana"    onclick="sv('semana')">Semana</button>
    <button class="nb"     id="tab-dashboard" onclick="sv('dashboard')">Dashboard</button>
    <button class="nb"     id="tab-historico" onclick="sv('historico')">Histórico</button>
    <button class="nb"     id="tab-config"    onclick="sv('config')">⚙</button>
  </nav>

  <div class="view on" id="view-hoje"></div>
  <div class="view"    id="view-semana"></div>
  <div class="view"    id="view-dashboard"></div>
  <div class="view"    id="view-historico"></div>
  <div class="view"    id="view-config"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
// ══════════════════════════════════════════════
// CONSTANTS
// ══════════════════════════════════════════════
const PLAN_START = new Date('2026-05-04');
const GOAL_21K   = new Date('2026-12-27');
const GOAL_42K   = new Date('2027-12-27');
const DAYS_LONG  = ['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];
const DAYS_SHORT = ['DOM','SEG','TER','QUA','QUI','SEX','SÁB'];

const TYPES = {
  corrida_leve:     {l:'Corrida Leve',    i:'🏃',cls:'bl',  z:'Z2'},
  corrida_moderada: {l:'Corrida Moderada',i:'🏃',cls:'bm',  z:'Z3'},
  corrida_intensa:  {l:'Corrida Intensa', i:'⚡',cls:'bi',  z:'Z4-Z5'},
  corrida_longa:    {l:'Corrida Longa',   i:'🏅',cls:'blo', z:'Z2'},
  academia:         {l:'Academia',        i:'💪',cls:'ba',  z:'—'},
  tabata_academia:  {l:'Tabata',          i:'⏱',cls:'bt',  z:'Z4-Z5'},
  descanso:         {l:'Descanso',        i:'😴',cls:'bd',  z:'—'},
};

// ══════════════════════════════════════════════
// STATE
// ══════════════════════════════════════════════
const S = {
  view: 'hoje',
  logs: JSON.parse(localStorage.getItem('r50_logs') || '{}'),
  theme: localStorage.getItem('r50_theme') || 'dark',
  apiKey: localStorage.getItem('r50_key') || '',
  noAI: localStorage.getItem('r50_noai') === '1',
};
const ciState = {};
const chartInst = {};

// ══════════════════════════════════════════════
// UTILS
// ══════════════════════════════════════════════
const now    = () => new Date();
const dkey   = d  => d.toISOString().slice(0,10);
const dUntil = d  => Math.max(0, Math.ceil((new Date(d) - now()) / 86400000));
const avg    = arr => arr.length ? arr.reduce((a,b)=>a+b,0)/arr.length : 0;

function weekNum() {
  const diff = now() - PLAN_START;
  return diff < 0 ? 0 : Math.floor(diff / (7*86400000)) + 1;
}
function isRecov(w) { return w > 0 && w % 4 === 0; }
function longKm(w) {
  if (w <= 0) return 8;
  const c = Math.ceil(w/4), p = w%4||4;
  if (p === 4) return Math.min(Math.max(6+(c-1)*2, 8), 18);
  return Math.min(8+(c-1)*2+(p-1), 21);
}
function planType(dow, w) {
  if (w <= 0) return 'descanso';
  const r = isRecov(w);
  switch(dow){
    case 1: return 'corrida_leve';
    case 2: return 'academia';
    case 3: return r ? 'corrida_moderada' : 'corrida_intensa';
    case 4: return 'tabata_academia';
    case 5: return w<=8 ? 'corrida_leve' : 'corrida_moderada';
    case 6: return 'corrida_longa';
    default: return 'descanso';
  }
}
function adjustType(type, ci) {
  if (!ci) return type;
  const s = (ci.fadiga + ci.dor) / 2;
  if (s >= 4) {
    if (type === 'corrida_intensa')  return 'corrida_leve';
    if (type === 'corrida_moderada') return 'corrida_leve';
    if (type === 'corrida_longa')    return 'corrida_moderada';
    if (type === 'tabata_academia')  return 'academia';
  }
  return type;
}
function paceToSec(p) { if (!p) return null; const [m,s] = p.split(':').map(Number); return m*60+(s||0); }
function secToPace(s) { if (!s) return '—'; return `${Math.floor(s/60)}:${String(Math.round(s%60)).padStart(2,'0')}`; }
function autoPace(km, tMin) { if (!km||!tMin) return null; return Math.round((tMin*60)/km); }
function saveL() { localStorage.setItem('r50_logs', JSON.stringify(S.logs)); }
function getL(k) { return S.logs[k] || null; }
function putL(k, d) { S.logs[k] = {...(S.logs[k]||{}), ...d}; saveL(); }
function scoreColor(s) { return s>=85?'sc-ex':s>=70?'sc-ok':s>=50?'sc-wa':'sc-bd'; }
function scoreFill(s)  { return s>=85?'sf-ex':s>=70?'sf-ok':s>=50?'sf-wa':'sf-bd'; }

// ══════════════════════════════════════════════
// WEEK DATA
// ══════════════════════════════════════════════
function weekStart(w) {
  const d = new Date(PLAN_START);
  d.setDate(d.getDate() + (w-1)*7);
  return d;
}
function getWeekLogs(w) {
  const start = weekStart(w);
  const logs = [];
  for (let i=0; i<7; i++) {
    const d = new Date(start); d.setDate(start.getDate()+i);
    const k = dkey(d);
    const dow = d.getDay();
    const l = S.logs[k];
    logs.push({key:k, date:d, dow, planned: planType(dow,w), ...(l||{}), exists:!!l});
  }
  return logs;
}

// ══════════════════════════════════════════════
// SCORING
// ══════════════════════════════════════════════
function calcScore(w) {
  const wl = getWeekLogs(w);
  const done = wl.filter(d => d.done);

  // Consistency
  const planned = wl.filter(d => d.planned !== 'descanso');
  const missedCnt = planned.filter(d => !d.done).length;
  const consistencia = Math.max(0, 100 - missedCnt * 10);

  // Intensity: count days where Z4+Z5 > 50%
  const intenseDays = done.filter(d => {
    const z = d.metrics?.zonas_fc;
    return z && ((z.z4||0)+(z.z5||0)) > 50;
  }).length;
  const intensidade = intenseDays <= 2 ? 100 : intenseDays === 3 ? 70 : 40;

  // Recovery: avg (fadiga + dor) / 2
  const rec = done.map(d => ((d.checkin?.fadiga||3)+(d.checkin?.dor||2))/2).filter(v=>v>0);
  const avgRec = rec.length ? avg(rec) : 3;
  const recuperacao = avgRec <= 2 ? 100 : avgRec <= 3 ? 70 : 40;

  // Efficiency: compare pace+FC with previous week
  const prevDone = getWeekLogs(w-1).filter(d => d.done && d.metrics?.pace_sec);
  const currDone = done.filter(d => d.metrics?.pace_sec);
  let eficiencia = 70;
  if (prevDone.length && currDone.length) {
    const pp = avg(prevDone.map(d=>d.metrics.pace_sec));
    const cp = avg(currDone.map(d=>d.metrics.pace_sec));
    const pfcArr = prevDone.filter(d=>d.metrics?.fc).map(d=>d.metrics.fc);
    const cfcArr = currDone.filter(d=>d.metrics?.fc).map(d=>d.metrics.fc);
    const pfc = pfcArr.length ? avg(pfcArr) : 0;
    const cfc = cfcArr.length ? avg(cfcArr) : 0;
    const paceOk = cp < pp;
    const fcOk   = cfc < pfc && cfc > 0 && pfc > 0;
    if (paceOk && fcOk) eficiencia = 100;
    else if (paceOk || fcOk) eficiencia = 80;
    else eficiencia = 55;
  }

  const score = Math.round(consistencia*0.3 + intensidade*0.2 + recuperacao*0.2 + eficiencia*0.3);
  const enough = done.length >= 3;
  return {score, consistencia, intensidade, recuperacao, eficiencia, enough};
}

function getAlerts(w) {
  const alerts = [];
  const wl = getWeekLogs(w).filter(d => d.done);

  // Alert 1: single training Z4+Z5 > 60%
  wl.forEach(d => {
    const z = d.metrics?.zonas_fc;
    if (z && ((z.z4||0)+(z.z5||0)) > 60)
      alerts.push({t:'warn', msg:`Treino de ${DAYS_LONG[d.dow]} com Z4+Z5 > 60%. Reduzir carga nos próximos dias.`});
  });

  // Alert 2: >2 intense days
  const intDays = wl.filter(d=>{const z=d.metrics?.zonas_fc;return z&&((z.z4||0)+(z.z5||0))>50;}).length;
  if (intDays > 2) alerts.push({t:'danger', msg:`${intDays} treinos intensos esta semana — excede o limite de 2.`});

  // Alert 3: high fatigue
  const hiFatigue = wl.filter(d=>(d.checkin?.fadiga||0)>=4);
  if (hiFatigue.length) alerts.push({t:'danger', msg:`Fadiga elevada em ${hiFatigue.length} dia(s). Risco de sobrecarga.`});

  // Alert 4: volume increase > 20%
  const prevKm = getWeekLogs(w-1).filter(d=>d.done&&d.metrics?.km).reduce((a,d)=>a+(d.metrics.km||0),0);
  const currKm = wl.filter(d=>d.metrics?.km).reduce((a,d)=>a+(d.metrics.km||0),0);
  if (prevKm > 0 && currKm > prevKm * 1.2)
    alerts.push({t:'warn', msg:`Volume subiu ${Math.round((currKm/prevKm-1)*100)}% vs semana anterior (${currKm.toFixed(1)} vs ${prevKm.toFixed(1)} km).`});

  return alerts;
}

function getInterp(score) {
  if (score >= 85) return {msg:'Excelente evolução. Pode progredir a carga com segurança.', cls:'al-ok'};
  if (score >= 70) return {msg:'Boa consistência. Mantenha a estratégia atual.', cls:'al-info'};
  if (score >= 50) return {msg:'Atenção. Ajuste a intensidade e priorize recuperação.', cls:'al-warn'};
  return {msg:'Risco de regressão. Reduza a carga e priorize treinos leves.', cls:'al-danger'};
}

// ══════════════════════════════════════════════
// WEEKLY AGGREGATION (for charts)
// ══════════════════════════════════════════════
function aggregateWeeks(max = 16) {
  const w = weekNum();
  const res = [];
  for (let i = Math.max(1, w-max+1); i <= w; i++) {
    const wl = getWeekLogs(i).filter(d=>d.done);
    const runLogs = wl.filter(d=>d.metrics?.km);
    const km = runLogs.reduce((a,d)=>a+(d.metrics.km||0),0);
    const pArr = runLogs.filter(d=>d.metrics?.pace_sec).map(d=>d.metrics.pace_sec);
    const fcArr = runLogs.filter(d=>d.metrics?.fc).map(d=>d.metrics.fc);
    const longo = Math.max(0, ...runLogs.map(d=>d.metrics.km||0));
    const {score} = calcScore(i);
    res.push({w:i, lbl:`S${i}`, km:+km.toFixed(1), pace:pArr.length?avg(pArr):null, fc:fcArr.length?Math.round(avg(fcArr)):null, longo:longo||null, score:wl.length>=3?score:null});
  }
  return res;
}

function weekZones(w) {
  const wl = getWeekLogs(w).filter(d=>d.done&&d.metrics?.zonas_fc);
  if (!wl.length) return null;
  const z = {z1:0,z2:0,z3:0,z4:0,z5:0};
  wl.forEach(d=>{const zf=d.metrics.zonas_fc;['z1','z2','z3','z4','z5'].forEach(k=>z[k]+=(zf[k]||0));});
  const tot = Object.values(z).reduce((a,b)=>a+b,0);
  if (!tot) return null;
  return Object.fromEntries(Object.entries(z).map(([k,v])=>[k,Math.round(v/wl.length)]));
}

async function callAI(type, w, ci, lkm) {
  if (!S.apiKey || S.noAI) return null;
  const d = now();
  const rec = isRecov(w);
  const prompt = `Você é o treinador de Marcos Luperce. Gere o treino de hoje.
PERFIL: Corre ~8 km, ritmo 6:00/km, FC média 149bpm. Treina 5:30h. Objetivo 1: 21km em 27/12/2026.
HOJE: ${DAYS_LONG[d.getDay()]}, ${d.toLocaleDateString('pt-BR')}
Semana ${w}${rec?' — RECUPERAÇÃO':''}. Treino: ${TYPES[type]?.l}. Longo semana: ${lkm}km.
CHECK-IN: Fadiga:${ci?.fadiga||3}/5 Dor:${ci?.dor||2}/5 Sono:${ci?.sono||3}/5 Motivação:${ci?.motivacao||3}/5
${(ci?.fadiga||0)>=4||((ci?.fadiga||0)+(ci?.dor||0))/2>=3.5?'⚠️ ESTRESSE ALTO — reduza intensidade.':''}
Retorne EXATAMENTE (sem markdown):
TREINO: [nome]
INTENSIDADE: [Leve/Moderada/Alta]
ZONAS: [ex: Z2]
DURAÇÃO: [ex: 45 min]
DISTÂNCIA: [ex: 8 km ou —]
RITMO: [ex: 6:20-7:00/km ou —]
FC_ALVO: [ex: 103-136 bpm]
DESCRIÇÃO:
[bullets •, máx 90 palavras]
OBSERVAÇÃO:
[1-2 frases baseadas no check-in]
MOTIVAÇÃO:
[1 frase, real, não clichê]`;
  const r = await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':S.apiKey,'anthropic-version':'2023-06-01'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:700,messages:[{role:'user',content:prompt}]})});
  if (!r.ok) throw new Error('API '+r.status);
  const j = await r.json();
  if (j.error) throw new Error(j.error.message);
  return j.content[0].text;
}
function parseAI(txt) {
  const g = k => { const m = txt.match(new RegExp(k+':\\s*([\\s\\S]+?)(?=\\n[A-ZÇÃÉ_]{3,}:|$)')); return m?m[1].trim():''; };
  return {titulo:g('TREINO'),intensidade:g('INTENSIDADE'),zonas:g('ZONAS'),duracao:g('DURAÇÃO'),distancia:g('DISTÂNCIA'),ritmo:g('RITMO'),fc:g('FC_ALVO'),descricao:g('DESCRIÇÃO'),obs:g('OBSERVAÇÃO'),motivacao:g('MOTIVAÇÃO')};
}

function setStar(k, v) {
  ciState[k] = v;
  document.querySelectorAll(`[data-k="${k}"]`).forEach((b,i)=>b.classList.toggle('on',i<v));
  const ok = ['fadiga','dor','sono','motivacao'].every(k=>ciState[k]);
  const b = document.getElementById('ci-btn');
  if (b) b.disabled = !ok;
}

async function submitCI(key, type, w, lkm) {
  const ci = {fadiga:ciState.fadiga||3,dor:ciState.dor||2,sono:ciState.sono||3,motivacao:ciState.motivacao||3};
  putL(key, {checkin:ci});
  const adj = adjustType(type, ci);
  await doGen(key, adj, w, lkm);
}

async function doGen(key, type, w, lkm) {
  const log = getL(key);
  const btn = document.getElementById('gen-btn') || document.getElementById('ci-btn');
  if (btn) { btn.disabled=true; btn.innerHTML='<span class="spinner"></span> Gerando...'; }
  let training = null;
  try {
    const txt = await callAI(type, w, log?.checkin, lkm);
    training = txt ? parseAI(txt) : fallback(type, w, log?.checkin, lkm);
  } catch(e) { training = fallback(type, w, log?.checkin, lkm); }
  putL(key, {training, adjustedType:type});
  renderHoje();
}

async function regenT(key, type, w, lkm) {
  putL(key, {training:null});
  await doGen(key, type, w, lkm);
}

function markRest(key) {
  putL(key, {done:true, adjustedType:'descanso', training:fallback('descanso',weekNum(),null,0)});
  renderHoje();
}

        <span class="z-label" style="color:${colors[i]}">Z${i+1}</span>
        <input class="z-input" id="z-${z}" type="number" min="0" max="100" value="${val}" oninput="updateZsum()">
        <div class="z-bar-wrap"><div class="z-bar" id="zbar-${z}" style="width:${val}%;background:${colors[i]}"></div></div>
      </div>`;
    }).join('')}

    <div class="div"></div>

      <div class="field"><label>Dor musc.</label><input id="r-dor" type="number" min="1" max="5" value="${log.checkin?.dor||''}" placeholder="1–5"></div>
      <div class="field"><label>PSE</label><input id="r-pse" type="number" min="1" max="10" value="${m.pse||''}" placeholder="1–10"></div>
    </div>

}

function autocalcPace() {
  const km = parseFloat(document.getElementById('r-km')?.value);
  const t  = parseFloat(document.getElementById('r-time')?.value);
  const sec = autoPace(km, t);
  const el = document.getElementById('r-pace');
  const hint = document.getElementById('pace-hint');
  if (el && sec) { const p = secToPace(sec); el.value = p; if (hint) hint.textContent = '= ' + p; }
}

function updateZsum() {
  const vals = ['z1','z2','z3','z4','z5'].map(z=>parseInt(document.getElementById('z-'+z)?.value||0)||0);
  const sum = vals.reduce((a,b)=>a+b,0);
  const colors = ['#34d399','#a3e635','#fbbf24','#fb923c','#f87171'];
  vals.forEach((v,i) => {
    const bar = document.getElementById('zbar-z'+(i+1));
    if (bar) bar.style.width = Math.min(v,100)+'%';
  });
  const el = document.getElementById('z-sum');
  if (el) { el.textContent = `Soma: ${sum}%`; el.className = 'z-sum '+(sum===100?'ok':'err'); }
}

function saveReg(key) {
  const km  = parseFloat(document.getElementById('r-km')?.value)||null;
  const tMin= parseFloat(document.getElementById('r-time')?.value)||null;
  const pSec = autoPace(km, tMin);
  const fc  = parseInt(document.getElementById('r-fc')?.value)||null;
  const paceStr = document.getElementById('r-pace')?.value || (pSec ? secToPace(pSec) : null);
  const zonas_fc = {};
  ['z1','z2','z3','z4','z5'].forEach(z => { const v = parseInt(document.getElementById('z-'+z)?.value); if(v) zonas_fc[z]=v; });
  const metrics = {
    km, time_min:tMin, pace:paceStr, pace_sec:pSec, fc,
    fc_max: parseInt(document.getElementById('r-fcmax')?.value)||null,
    zonas_fc: Object.keys(zonas_fc).length ? zonas_fc : null,
    fadiga: parseInt(document.getElementById('r-fad')?.value)||null,
    dor: parseInt(document.getElementById('r-dor')?.value)||null,
    pse: parseInt(document.getElementById('r-pse')?.value)||null,
    obs: document.getElementById('r-obs')?.value||null,
  };
  const log = getL(key) || {};
  const ci = log.checkin || {};
  if (metrics.fadiga) ci.fadiga = metrics.fadiga;
  if (metrics.dor) ci.dor = metrics.dor;
  putL(key, {done:true, metrics, checkin:ci, completedAt:new Date().toISOString()});
  renderHoje();
}

function showData(key) {
  const log = getL(key) || {};
  const m = log.metrics || {};
  alert(`📊 Dados de ${key}\n\nDistância: ${m.km||'—'} km\nTempo: ${m.time_min||'—'} min\nPace: ${m.pace||'—'}\nFC média: ${m.fc||'—'} bpm\nFC máx: ${m.fc_max||'—'} bpm\nZonas: ${JSON.stringify(m.zonas_fc)||'—'}\nPSE: ${m.pse||'—'}\nFadiga: ${m.fadiga||log.checkin?.fadiga||'—'}`);
}

function renderSemana() {
  const el = document.getElementById('view-semana');
  const d = now(); const dow = d.getDay(); const w = weekNum();
  const rec = isRecov(w); const lkm = longKm(w);
  const wl = getWeekLogs(w);

  const monday = new Date(d);
  monday.setDate(d.getDate() - (dow===0?6:dow-1));
  const days7 = Array.from({length:7},(_,i)=>{const x=new Date(monday);x.setDate(monday.getDate()+i);return x;});

  const {score,consistencia,intensidade,recuperacao,eficiencia,enough} = calcScore(w);
  const alerts = getAlerts(w);
  const interp = getInterp(score);

  // Stats
  const doneLogs = wl.filter(d=>d.done);
  const totalKm = doneLogs.reduce((a,d)=>a+(d.metrics?.km||0),0);
  const intDays = doneLogs.filter(d=>{const z=d.metrics?.zonas_fc;return z&&((z.z4||0)+(z.z5||0))>50;}).length;

  const sc = score; const rad = 32; const circ = 2*Math.PI*rad;
  const fill = sc/100*circ; const gap = circ - fill;
  const sColor = sc>=85?'#34d399':sc>=70?'#a3e635':sc>=50?'#fbbf24':'#f87171';

  let h = `<div class="sec-hd">Semana ${w}${rec?' — Recuperação':''}</div>`;

  // Week grid
  h += `<div class="wk-grid">`;
  days7.forEach(day => {
    const actualDow = day.getDay();
    const k = dkey(day);
    const log = getL(k);
    const type = planType(actualDow, w);
    const T = TYPES[type];
    const isToday = dkey(day) === dkey(d);
    const isPast = day < d && !isToday;
    const done = log?.done;
    const missed = isPast && !done && type !== 'descanso';
    let cls = 'wd';
    if (isToday) cls += ' today';
    else if (done) cls += ' done';
    else if (missed) cls += ' missed';
    h += `<div class="${cls}">
      <div class="wd-name">${DAYS_SHORT[actualDow]}</div>
      <div class="wd-icon">${done?'✅':T.i}</div>
      <div class="wd-num">${day.getDate().toString().padStart(2,'0')}/${(day.getMonth()+1).toString().padStart(2,'0')}</div>
    </div>`;
  });
  h += `</div>`;

  // Weekly metrics
  h += `<div class="sec-hd">Métricas</div>
  <div class="mg">
    <div class="mc"><div class="mc-v">${totalKm.toFixed(1)}</div><div class="mc-l">km total</div></div>
    <div class="mc"><div class="mc-v">${doneLogs.length}</div><div class="mc-l">treinos feitos</div><div class="mc-bar"><div class="mc-fill" style="width:${Math.round(doneLogs.length/6*100)}%"></div></div></div>
    <div class="mc"><div class="mc-v">${intDays}</div><div class="mc-l">dias intensos <span style="font-size:9px;color:var(--t3)">(máx 2)</span></div><div class="mc-bar"><div class="mc-fill ${intDays<=2?'g':''}" style="width:${Math.min(Math.round(intDays/4*100),100)}%;${intDays>2?'background:var(--red)':''}"></div></div></div>
    <div class="mc"><div class="mc-v">${lkm}</div><div class="mc-l">km longo</div><div class="mc-bar"><div class="mc-fill g" style="width:${Math.round(lkm/21*100)}%"></div></div></div>
  </div>`;

  // Score
  h += `<div class="sec-hd">Score Semanal</div>
  <div class="card">
    ${!enough?`<div class="alert al-info" style="margin-bottom:0"><span class="alert-ico">ℹ️</span>Registre ao menos 3 treinos para calcular o score.</div>`:
    `<div class="score-wrap">
      <div class="score-ring">
        <svg viewBox="0 0 80 80" width="80" height="80">
          <circle cx="40" cy="40" r="${rad}" fill="none" stroke="var(--bg4)" stroke-width="7"/>
          <circle cx="40" cy="40" r="${rad}" fill="none" stroke="${sColor}" stroke-width="7"
            stroke-dasharray="${fill} ${gap}" stroke-linecap="round"/>
        </svg>
        <div class="score-num">
          <div class="score-val ${scoreColor(sc)}">${sc}</div>
          <div class="score-lbl">score</div>
        </div>
      </div>
      <div class="score-breakdown">
        ${[['Consistência',consistencia],['Intensidade',intensidade],['Recuperação',recuperacao],['Eficiência',eficiencia]].map(([n,v])=>`
        <div class="sb-row">
          <div class="sb-name">${n}</div>
          <div class="sb-bar"><div class="sb-fill ${scoreFill(v)}" style="width:${v}%"></div></div>
          <div class="sb-val ${scoreColor(v)}">${v}</div>
        </div>`).join('')}
      </div>
    </div>
    <div class="score-interp">
      <span class="alert-ico">${sc>=85?'🚀':sc>=70?'✅':sc>=50?'⚠️':'🔴'}</span> ${interp.msg}
    </div>`}
  </div>`;

  // Alerts
  if (alerts.length) {
    h += `<div class="sec-hd">Alertas</div><div style="padding:0 13px">`;
    alerts.forEach(a => h += `<div class="alert al-${a.t}"><span class="alert-ico">${a.t==='danger'?'🔴':'⚠️'}</span><span>${a.msg}</span></div>`);
    h += `</div>`;
  }

  // Plan this week
  h += `<div class="sec-hd">Plano da Semana</div><div class="card">`;
  days7.forEach(day => {
    const actualDow = day.getDay();
    if (actualDow === 0) return;
    const k = dkey(day);
    const type = planType(actualDow, w);
    const fb = fallback(type, w, null, lkm);
    const log = getL(k);
    const isToday2 = dkey(day) === dkey(d);
    const T = TYPES[type];
    h += `<div style="display:flex;align-items:flex-start;gap:9px;padding:8px 0;border-bottom:1px solid var(--border)">
      <div style="width:28px;text-align:center;font-size:17px;flex-shrink:0;margin-top:2px">${log?.done?'✅':T.i}</div>
      <div style="flex:1">
        <div style="font-size:10px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:var(--t3)">${DAYS_LONG[actualDow].split('-')[0]} ${day.getDate().toString().padStart(2,'0')}/${(day.getMonth()+1).toString().padStart(2,'0')}${isToday2?' <span style="color:var(--ora)">← hoje</span>':''}</div>
        <div style="font-size:13px;font-weight:600;margin-top:1px">${fb.titulo}</div>
        <div style="font-size:11px;color:var(--t2)">${fb.duracao} · ${fb.zonas}</div>
      </div>
      <span class="badge ${T.cls}" style="flex-shrink:0">${T.i}</span>
    </div>`;
  });
  h += `<div style="display:flex;align-items:center;gap:9px;padding:8px 0"><div style="width:28px;text-align:center;font-size:17px">😴</div><div style="font-size:12px;color:var(--t2)">Domingo — Descanso Total</div></div></div>`;

  el.innerHTML = h;
}

function makeChart(id, cfg) {
  if (chartInst[id]) { try{chartInst[id].destroy();}catch(e){} }
  const c = document.getElementById(id);
  if (!c) return;
  const isDark = document.documentElement.getAttribute('data-theme') !== 'light';
  Chart.defaults.color = isDark ? '#5c5c72' : '#9898ac';
  Chart.defaults.borderColor = isDark ? 'rgba(255,255,255,0.05)' : 'rgba(0,0,0,0.05)';
  chartInst[id] = new Chart(c, cfg);
}

function renderHistorico() {
  const el = document.getElementById('view-historico');
  const entries = Object.entries(S.logs)
    .filter(([,l])=>l.done||l.checkin)
    .sort(([a],[b])=>b.localeCompare(a))
    .slice(0,40);

  if (!entries.length) {
    el.innerHTML = `<div class="card" style="text-align:center;padding:30px;margin-top:20px"><div style="font-size:32px;margin-bottom:8px">📋</div><div style="color:var(--t2)">Nenhum treino ainda.</div></div>`;
    return;
  }

  let h = `<div class="sec-hd">Histórico (${entries.length} registros)</div><div class="card">`;
  entries.forEach(([k,log]) => {
    const d = new Date(k+'T12:00:00');
    const dow = d.getDay();
    const w = Math.max(1, Math.floor((d - PLAN_START)/(7*86400000))+1);
    const type = log.adjustedType || planType(dow, w);
    const T = TYPES[type] || TYPES.descanso;
    const m = log.metrics || {};
    h += `<div class="hi">
      <div class="hi-dot ${log.done?'':'miss'}"></div>
      <div style="flex:1">
        <div class="hi-date">${d.toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'2-digit'})} · S${w}</div>
        <div class="hi-name">${T.i} ${log.training?.titulo||T.l}</div>
        ${m.km||m.fc||m.pace?`<div class="hi-ms">
          ${m.km?`<span class="hi-m"><span>dist</span>${m.km}km</span>`:''}
          ${m.time_min?`<span class="hi-m"><span>tempo</span>${Math.floor(m.time_min)}min</span>`:''}
          ${m.fc?`<span class="hi-m"><span>FC</span>${m.fc}bpm</span>`:''}
          ${m.pace?`<span class="hi-m"><span>pace</span>${m.pace}</span>`:''}
          ${m.pse?`<span class="hi-m"><span>PSE</span>${m.pse}/10</span>`:''}
        </div>`:''}
        ${m.obs?`<div style="font-size:10px;color:var(--t3);margin-top:3px;font-style:italic">"${m.obs}"</div>`:''}
      </div>
    </div>`;
  });
  h += `</div>`;
  el.innerHTML = h;
}

      Objetivo 2: <strong>42 km — 27/12/2027</strong><br>
      Semana atual: <strong>${weekNum()}</strong><br>
      Corrida longa: <strong>${longKm(weekNum())} km</strong><br>
      Score: <strong>${calcScore(weekNum()).score} / 100</strong>
    </div>
  </div>
  <div class="card">
    <div class="card-lbl">Zonas de FC</div>
    ${[['Z1','Aquecimento','86–102 bpm','z1c'],['Z2','Fácil / Base aeróbica','103–119 bpm','z2c'],['Z3','Aeróbico constante','120–136 bpm','z3c'],['Z4','Limiar','137–153 bpm','z4c'],['Z5','Máximo','>153 bpm','z5c']].map(([z,d,fc,cls])=>`
    <div class="zfc-row">
      <span class="zfc-tag ${cls}">${z}</span>
      <div style="flex:1"><div style="font-size:12px">${d}</div><div style="font-size:10px;color:var(--t3);font-family:'JetBrains Mono',monospace">${fc}</div></div>
    </div>`).join('')}
  </div>
  <div class="card">
    <div class="card-lbl">Dados</div>
    <div style="font-size:12px;color:var(--t2);margin-bottom:12px">${Object.keys(S.logs).length} registros no localStorage</div>
    <button class="btn btn-gh" style="width:100%;margin-bottom:8px" onclick="exportData()">⬇️ Exportar JSON</button>
    <button class="btn btn-gh" style="width:100%;color:var(--red)" onclick="clearData()">🗑️ Apagar todos os dados</button>
  </div>`;
}

function saveConfig() {
  S.apiKey = document.getElementById('cfg-key')?.value||'';
  localStorage.setItem('r50_key', S.apiKey);
  const btn = event.target; btn.textContent = '✅ Salvo!'; setTimeout(()=>btn.textContent='Salvar',1500);
}
function exportData() {
  const blob = new Blob([JSON.stringify({version:'run50plus',exportedAt:new Date().toISOString(),logs:S.logs},null,2)],{type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = `run50plus-${dkey(now())}.json`; a.click();
}
function clearData() {
  if (confirm('Apagar TODOS os dados? Irreversível.')) { S.logs={}; saveL(); sv('hoje'); }
}

// ══════════════════════════════════════════════
// NAV + THEME + SETUP + INIT
// ══════════════════════════════════════════════
const renders = {hoje:renderHoje, semana:renderSemana, dashboard:renderDashboard, historico:renderHistorico, config:renderConfig};
function sv(v) {
  S.view = v;
  document.querySelectorAll('.view').forEach(e=>e.classList.toggle('on',e.id==='view-'+v));
  document.querySelectorAll('.nb').forEach(b=>b.classList.toggle('on',b.id==='tab-'+v));
  if (renders[v]) renders[v]();
}
function toggleTheme() {
  S.theme = S.theme==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',S.theme);
  localStorage.setItem('r50_theme',S.theme);
  if (S.view==='dashboard') renderDashboard();
}
function saveKey() {
  S.apiKey = document.getElementById('key-inp')?.value||'';
  localStorage.setItem('r50_key',S.apiKey);
  localStorage.setItem('r50_setup','1');
  document.getElementById('setup').style.display='none';
  renderHoje();
}
function skipSetup() {
  S.noAI=true; localStorage.setItem('r50_noai','1'); localStorage.setItem('r50_setup','1');
  document.getElementById('setup').style.display='none'; renderHoje();
}
function init() {
  document.documentElement.setAttribute('data-theme', S.theme);
  const w = weekNum();
  if (now() > GOAL_21K) {
    const p = document.getElementById('hdr-phase');
    if (p) { p.textContent='Fase 2 · 42km'; p.className='phase-tag pt2'; }
  }
  if (!localStorage.getItem('r50_setup')&&!S.apiKey) {
    document.getElementById('setup').style.display='flex'; return;
  }
  renderHoje();
}
init();
</script>
</body>
</html>
